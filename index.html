<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Command debug</title>
<style>
  body { font: 14px/1.5 monospace; padding: 20px; white-space: pre-wrap; }
</style>
</head>
<body>
<script>
(async () => {
  const params = new URLSearchParams(location.search);

  const callback = params.get("callback") || "";
  const debug = params.get("debug") === "1";

  const payload = {
    command: params.get("command") || "",
    task: params.get("task") || "",
    userEmail: params.get("userEmail") || ""
  };

  const log = (...args) => {
    console.log("[command]", ...args);
    if (debug) {
      document.body.textContent += args.map(v =>
        typeof v === "string" ? v : JSON.stringify(v, null, 2)
      ).join(" ") + "\n";
    }
  };

  log("START");
  log("Page:", location.href);
  log("Callback:", callback);
  log("Payload:", payload);

  if (!callback) {
    log("ERROR: callback is empty");
    if (!debug) window.close();
    return;
  }

  try {
    log("Sending POST...");

    const response = await fetch(callback, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(payload),
      keepalive: true
    });

    log("Response status:", response.status);
    log("Response ok:", response.ok);

    let text = "";
    try {
      text = await response.text();
    } catch (e) {
      text = "[response body unavailable]";
    }

    if (text) log("Response body:", text);
    log("DONE");
  } catch (e) {
    log("FETCH ERROR:", e && e.message ? e.message : String(e));
  }

  if (!debug) {
    window.close();
  } else {
    log("");
    log("DEBUG MODE: window will remain open.");
  }
})();
</script>
</body>
</html>
